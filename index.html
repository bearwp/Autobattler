<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dungeon Autobattler</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0d0d12; color: #e0e0e0;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    #app { display: flex; flex-direction: column; height: 100vh; }
    #hud {
      display: flex; align-items: center; gap: 16px;
      padding: 8px 16px; background: #16161d;
      border-bottom: 1px solid #2a2a35; font-size: 14px;
      flex: 0 0 auto;
    }
    #hud .status { font-weight: 600; }
    #hud .status.win { color: #4ade80; }
    #hud .status.lose { color: #f87171; }
    #hud .hint { color: #888; font-size: 12px; }
    #canvas-wrap { flex: 1 1 auto; position: relative; min-height: 0; }
    canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud">
      <span class="status" id="status">Ready</span>
      <span class="hint">Space: start &nbsp;·&nbsp; R: reset</span>
    </div>
    <div id="canvas-wrap">
      <canvas id="game"></canvas>
    </div>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
