<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dungeon Autobattler</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0d0d12; color: #e0e0e0;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    #hud {
      display: flex; align-items: center; gap: 16px;
      padding: 8px 16px; background: #16161d;
      border-bottom: 1px solid #2a2a35; font-size: 14px;
      flex: 0 0 auto;
    }
    #hud .status { font-weight: 600; }
    #hud .status.win { color: #4ade80; }
    #hud .status.lose { color: #f87171; }
    #hud .hint { color: #888; font-size: 12px; }
    #hud button {
      background: #2a2a35; color: #e0e0e0; border: 1px solid #3a3a45;
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    #hud button:hover { background: #3a3a45; }
    #hud button.toggle.on { background: #1d4ed8; border-color: #2563eb; }
    #hud button.toggle.on:hover { background: #2563eb; }
    #canvas-wrap { flex: 1 1 auto; position: relative; min-height: 0; }
    canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }

    /* Bottom team UI */
    #team-ui {
      flex: 0 0 auto;
      display: flex; justify-content: center; gap: 8px;
      padding: 8px 8px; background: #16161d;
      border-top: 1px solid #2a2a35;
      flex-wrap: wrap;
    }
    .member {
      display: flex; align-items: center; gap: 8px;
      background: #1e1e26; border: 1px solid #2a2a35;
      border-radius: 8px; padding: 6px 10px; min-width: 120px;
      flex: 1 1 120px; max-width: 220px;
    }
    .member.dead { opacity: 0.4; }
    .member.dead .name::after { content: ' — dead'; color: #f87171; font-size: 10px; }
    .member .icon {
      width: 24px; height: 24px; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center;
    }
    .member .info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
    .member .name { font-weight: 600; font-size: 12px; }
    .member .ability { font-size: 10px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .member .hpbar {
      width: 100%; height: 5px; background: #000; border-radius: 3px; overflow: hidden;
    }
    .member .hpfill { height: 100%; background: #4ade80; transition: width 0.1s; }

    /* Customizer */
    #customizer {
      flex: 0 0 auto;
      display: flex; flex-direction: column; gap: 10px;
      padding: 10px 16px; background: #12121a;
      border-top: 1px solid #2a2a35;
      max-height: 45vh; overflow-y: auto;
    }
    #customizer .toolbar {
      display: flex; gap: 8px; align-items: center;
      position: sticky; top: 0; background: #12121a; padding: 4px 0; z-index: 1;
    }
    #customizer .toolbar h3 { margin: 0; font-size: 13px; color: #aaa; flex: 1; }
    #customizer .toolbar button {
      background: #2a2a35; color: #e0e0e0; border: 1px solid #3a3a45;
      padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
    }
    #customizer .toolbar button:hover { background: #3a3a45; }
    #customizer .toolbar button.primary { background: #1d4ed8; border-color: #2563eb; }
    #customizer .toolbar button.primary:hover { background: #2563eb; }
    #customizer.collapsed #member-list { display: none; }
    #customizer.collapsed { max-height: none; }

    #member-list {
      display: flex; gap: 8px; align-items: flex-start;
      overflow-x: auto; padding-bottom: 4px;
    }
    #member-list .mcard {
      flex: 1 1 0; min-width: 240px;
    }
    .mcard {
      background: #1e1e26; border: 1px solid #2a2a35; border-radius: 8px;
      padding: 6px 8px; display: flex; flex-direction: column; gap: 6px;
    }
    .mcard .mhead {
      display: flex; align-items: center; gap: 6px; cursor: pointer;
      user-select: none;
    }
    .mcard .mhead .icon { width: 20px; height: 20px; flex: 0 0 auto; }
    .mcard .mname {
      flex: 0 0 auto; width: 90px; background: #16161d; color: #e0e0e0;
      border: 1px solid #2a2a35; border-radius: 4px; padding: 3px 6px;
      font-size: 12px; font-weight: 600;
    }
    .mcard .msummary {
      flex: 1; font-size: 10px; color: #777; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .mcard .mremove {
      background: #3a1d1d; color: #f87171; border: 1px solid #5a2a2a;
      border-radius: 4px; cursor: pointer; width: 20px; height: 20px; line-height: 1;
      font-size: 14px; flex: 0 0 auto;
    }
    .mcard .mremove:hover { background: #5a2a2a; }
    .mcard .mdup {
      background: #1d2a3a; color: #7dd3fc; border: 1px solid #2a4a6a;
      border-radius: 4px; cursor: pointer; width: 20px; height: 20px; line-height: 1;
      font-size: 13px; flex: 0 0 auto;
    }
    .mcard .mdup:hover { background: #2a4a6a; }

    .mcard .mbody { display: flex; flex-direction: column; gap: 5px; }
    .mcard.collapsed .mbody { display: none; }

    .mcard .row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .mcard .row input[type="color"] { width: 22px; height: 22px; border: none; background: none; padding: 0; cursor: pointer; }
    .mcard .row select {
      background: #16161d; color: #e0e0e0; border: 1px solid #2a2a35;
      border-radius: 4px; padding: 2px 4px; font-size: 11px;
    }
    .mcard .stat { display: inline-flex; align-items: center; gap: 2px; }
    .mcard .stat i { font-style: normal; font-size: 9px; color: #666; }
    .mcard .stat input {
      width: 38px; background: #16161d; color: #e0e0e0;
      border: 1px solid #2a2a35; border-radius: 4px; padding: 2px 3px; font-size: 11px;
    }

    /* Chip-based components */
    .chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: #16161d; border: 1px solid #2a2a35; border-radius: 6px;
      padding: 3px 6px; font-size: 11px; color: #e0e0e0;
    }
    .chip .chip-emoji { font-size: 12px; }
    .chip select {
      background: #1e1e26; color: #e0e0e0; border: 1px solid #2a2a35;
      border-radius: 4px; padding: 2px 3px; font-size: 11px;
    }
    .chip .chip-num { display: inline-flex; align-items: center; gap: 2px; color: #888; font-size: 10px; }
    .chip .chip-num input {
      width: 38px; background: #1e1e26; color: #e0e0e0;
      border: 1px solid #2a2a35; border-radius: 4px; padding: 2px 3px; font-size: 11px;
    }
    .chip.atk { border-color: #3a3a55; }
    .chip.tgt { border-color: #3a4a3a; }
    .chip.move { border-color: #4a3a3a; }

    .mod-row { display: flex; align-items: center; gap: 5px; }
    .mod-chips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
    .chip.mod {
      background: #1d2a3a; border-color: #2a4a6a; color: #7dd3fc;
      padding: 2px 6px; border-radius: 12px; font-size: 10px;
    }
    .chip.mod .chip-x {
      background: none; border: none; color: #7dd3fc; cursor: pointer;
      font-size: 12px; line-height: 1; padding: 0 0 0 2px;
    }
    .chip.mod .chip-x:hover { color: #f87171; }
    .chip.sp {
      background: #2a1d3a; border-color: #5a2a6a; color: #d8b4fe;
      padding: 2px 6px; border-radius: 12px; font-size: 10px;
    }
    .chip.sp .chip-x {
      background: none; border: none; color: #d8b4fe; cursor: pointer;
      font-size: 12px; line-height: 1; padding: 0 0 0 2px;
    }
    .chip.sp .chip-x:hover { color: #f87171; }
    .add-mod {
      background: #2a2a35; color: #e0e0e0; border: 1px dashed #3a3a45;
      border-radius: 12px; cursor: pointer; width: 18px; height: 18px;
      line-height: 1; font-size: 12px;
    }
    .add-mod:hover { background: #3a3a45; }
    .add-sp {
      background: #2a2a35; color: #d8b4fe; border: 1px dashed #5a2a6a;
      border-radius: 12px; cursor: pointer; width: 18px; height: 18px;
      line-height: 1; font-size: 12px;
    }
    .add-sp:hover { background: #3a3a45; }

    .leader-toggle { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; color: #aaa; }

    /* Modifier picker popup */
    .mod-picker {
      position: fixed; z-index: 100; background: #1e1e26;
      border: 1px solid #3a3a45; border-radius: 8px; padding: 4px;
      display: flex; flex-direction: column; gap: 2px; min-width: 200px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .mod-picker-item {
      display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
      background: none; border: none; color: #e0e0e0; text-align: left;
      padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 12px;
    }
    .mod-picker-item:hover { background: #2a2a35; }
    .mod-picker-item span { font-size: 10px; color: #888; }

    @media (max-width: 600px) {
      #hud { flex-wrap: wrap; gap: 8px; }
      .member { min-width: 100px; padding: 5px 8px; }
      .member .icon { width: 20px; height: 20px; }
    }

    /* Map overlay (Slay the Spire style) */
    #map-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0, 0, 0, 0.75);
      display: flex; align-items: center; justify-content: center;
    }
    #map-overlay.hidden { display: none; }
    .map-panel {
      background: #1e1e26; border: 1px solid #3a3a45; border-radius: 12px;
      padding: 20px 24px; max-width: 90vw; max-height: 90vh;
      display: flex; flex-direction: column; gap: 12px;
    }
    .map-panel h3 { margin: 0; color: #e0e0e0; font-size: 16px; }
    #map-svg { display: block; }
    .map-node { cursor: pointer; }
    .map-node circle { stroke: #3a3a45; stroke-width: 2; }
    .map-node text { fill: #e0e0e0; font-size: 11px; text-anchor: middle; }
    .map-node.available circle { stroke: #fbbf24; stroke-width: 3; }
    .map-node.available:hover circle { fill: #3a3a45; }
    .map-node.current circle { stroke: #4ade80; stroke-width: 3; }
    .map-node.done circle { opacity: 0.5; }
    .map-edge { stroke: #3a3a45; stroke-width: 2; }
    .map-edge.available { stroke: #fbbf24; }

    /* Rest overlay */
    #rest-overlay {
      position: fixed; inset: 0; z-index: 210;
      background: rgba(0, 0, 0, 0.75);
      display: flex; align-items: center; justify-content: center;
    }
    #rest-overlay.hidden { display: none; }
    .rest-panel {
      background: #1e1e26; border: 1px solid #3a3a45; border-radius: 12px;
      padding: 20px 24px; max-width: 90vw; max-height: 90vh;
      display: flex; flex-direction: column; gap: 12px;
    }
    .rest-panel h3 { margin: 0; color: #e0e0e0; font-size: 16px; }
    .rest-sub { margin: 0; color: #888; font-size: 12px; }
    #rest-candidates { display: flex; gap: 12px; flex-wrap: wrap; }
    .rest-candidate {
      background: #16161d; border: 1px solid #2a2a35; border-radius: 8px;
      padding: 12px; display: flex; flex-direction: column; gap: 6px;
      min-width: 140px; cursor: pointer;
    }
    .rest-candidate:hover { border-color: #fbbf24; }
    .rest-candidate.recruited { opacity: 0.4; pointer-events: none; }
    .rest-candidate .rc-name { color: #e0e0e0; font-weight: 600; font-size: 13px; }
    .rest-candidate .rc-stats { color: #888; font-size: 11px; }
    .rest-candidate .rc-attack { color: #aaa; font-size: 11px; }
    #btn-finish-rest {
      background: #1d4ed8; color: #fff; border: 1px solid #2563eb;
      padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    #btn-finish-rest:hover { background: #2563eb; }

    /* Debug side panel */
    #debug-panel {
      position: fixed; right: 12px; top: 60px; bottom: 12px; z-index: 150;
      width: 300px; background: #16161d; border: 1px solid #3a3a45;
      border-radius: 8px; display: flex; flex-direction: column;
      overflow: hidden;
    }
    #debug-panel.hidden { display: none; }
    #debug-panel .dbg-head {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-bottom: 1px solid #2a2a35;
      background: #1e1e26;
    }
    #debug-panel .dbg-head h4 { margin: 0; font-size: 12px; color: #e0e0e0; flex: 1; }
    #debug-panel .dbg-head .dbg-play {
      font-size: 10px; color: #4ade80; font-weight: 600;
    }
    #debug-panel .dbg-tabs {
      display: flex; gap: 4px; padding: 6px 8px 0;
      background: #1e1e26; border-bottom: 1px solid #2a2a35;
    }
    #debug-panel .dbg-tab {
      background: none; border: none; color: #888; cursor: pointer;
      font-size: 11px; padding: 4px 10px; border-radius: 6px 6px 0 0;
    }
    #debug-panel .dbg-tab:hover { color: #e0e0e0; }
    #debug-panel .dbg-tab.on { color: #e0e0e0; background: #16161d; }
    #debug-panel .dbg-body {
      flex: 1; overflow-y: auto; padding: 6px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .dbg-section { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin: 2px 2px 0; }
    .dbg-unit {
      background: #1e1e26; border: 1px solid #2a2a35; border-radius: 6px;
      padding: 6px 8px; font-size: 11px; display: flex; flex-direction: column; gap: 3px;
      cursor: pointer;
    }
    .dbg-unit:hover { border-color: #fbbf24; }
    .dbg-unit .dbg-name {
      display: flex; align-items: center; gap: 6px; font-weight: 600; color: #e0e0e0;
    }
    .dbg-unit .dbg-name .dbg-swatch { width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto; }
    .dbg-unit .dbg-name .dbg-team { font-size: 9px; font-weight: 400; color: #888; }
    .dbg-unit .dbg-name .dbg-hp { margin-left: auto; font-size: 10px; font-weight: 400; }
    .dbg-unit .dbg-hp.low { color: #f87171; }
    .dbg-unit .dbg-hp.ok { color: #4ade80; }
    .dbg-unit .dbg-row { display: flex; gap: 6px; color: #aaa; }
    .dbg-unit .dbg-row b { color: #e0e0e0; font-weight: 600; min-width: 44px; }
    .dbg-unit .dbg-intent { color: #fbbf24; }
    .dbg-unit .dbg-target { color: #7dd3fc; }
    .dbg-unit .dbg-goal { color: #d8b4fe; }
    .dbg-bond {
      display: flex; align-items: center; gap: 6px;
      font-size: 10px; color: #aaa; padding: 3px 2px;
    }
    .dbg-bond .dbg-swatch { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; }
    .dbg-bond .dbg-bond-val { color: #4ade80; font-weight: 600; margin-left: auto; }
    .dbg-empty { color: #666; font-size: 11px; padding: 8px 4px; }
    .dbg-play-row {
      background: #1e1e26; border: 1px solid #2a2a35; border-radius: 6px;
      padding: 6px 8px; font-size: 11px; color: #aaa;
    }
    .dbg-play-row b { color: #4ade80; }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud">
      <span class="status" id="status">Ready</span>
      <button id="btn-start">Start</button>
      <button id="btn-restart">Restart</button>
      <button id="btn-debug" class="toggle" title="Toggle debug panel">Debug</button>
      <button id="btn-plays" class="toggle" title="Toggle leader-called plays">Plays</button>
      <button id="btn-pause" title="Pause/resume the sim">Pause</button>
      <span class="hint">Space: start &nbsp;·&nbsp; R: reset &nbsp;·&nbsp; D: debug &nbsp;·&nbsp; P: pause</span>
    </div>
    <div id="canvas-wrap">
      <canvas id="game"></canvas>
    </div>
    <div id="customizer" class="collapsed">
      <div class="toolbar">
        <h3>Customize your team</h3>
        <button id="btn-add-member">+ Add member</button>
        <button id="btn-apply" class="primary">Apply</button>
        <button id="btn-toggle-customizer" title="Show/hide customizer">Show</button>
      </div>
      <div id="member-list"></div>
    </div>
    <div id="team-ui"></div>
    <div id="map-overlay" class="hidden">
      <div class="map-panel">
        <h3>Choose your path</h3>
        <svg id="map-svg"></svg>
      </div>
    </div>
    <div id="rest-overlay" class="hidden">
      <div class="rest-panel">
        <h3>Rest</h3>
        <p class="rest-sub">A new ally offers to join your team.</p>
        <div id="rest-candidates"></div>
        <button id="btn-finish-rest" class="primary">Continue</button>
      </div>
    </div>
    <div id="debug-panel" class="hidden">
      <div class="dbg-head">
        <h4>Debug</h4>
        <span class="dbg-play" id="dbg-play"></span>
      </div>
      <div class="dbg-tabs">
        <button class="dbg-tab on" data-tab="units">Units</button>
        <button class="dbg-tab" data-tab="bonds">Bonds</button>
        <button class="dbg-tab" data-tab="plays">Plays</button>
      </div>
      <div class="dbg-body" id="dbg-body"></div>
    </div>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
